name: Import visual Surface with source history

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-os-visual-source.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: surface-initial-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_REPO: ordaxsystems/ordax-os
      SOURCE_SHA: f65acc4fb9f8ded376fc9b44b4c7c2068c793265
      DESTINATION_BRANCH: migration/surface-source-20261023
    steps:
      - name: Checkout destination main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Ensure import branch does not exist
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "refs/heads/$DESTINATION_BRANCH"; then
            echo "::error::Import branch already exists; refusing to overwrite it"
            exit 1
          fi

      - name: Install pinned migration-only history filter
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/filter-venv"
          "$RUNNER_TEMP/filter-venv/bin/pip" install --disable-pip-version-check git-filter-repo==2.47.0

      - name: Filter UI and workspace history from immutable OS commit
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/ordax-os-source"
          git clone --single-branch --branch main --no-tags "https://github.com/$SOURCE_REPO.git" "$SRC"
          git -C "$SRC" cat-file -e "$SOURCE_SHA^{commit}"
          git -C "$SRC" checkout --detach "$SOURCE_SHA"
          git -C "$SRC" ls-tree -r HEAD -- system/surface/ui system/surface/workspace | LC_ALL=C sort > "$RUNNER_TEMP/original-surface-blobs.tsv"
          test "$(wc -l < "$RUNNER_TEMP/original-surface-blobs.tsv")" -eq 157
          "$RUNNER_TEMP/filter-venv/bin/git-filter-repo" --force --source "$SRC" --target "$SRC" \
            --path system/surface/ui/ --path system/surface/workspace/
          git -C "$SRC" ls-tree -r HEAD | LC_ALL=C sort > "$RUNNER_TEMP/imported-surface-blobs.tsv"
          diff -u "$RUNNER_TEMP/original-surface-blobs.tsv" "$RUNNER_TEMP/imported-surface-blobs.tsv"
          git -C "$SRC" rev-parse HEAD > "$RUNNER_TEMP/filtered-source-commit"
          echo "Exact Git modes, blob IDs and paths match OS source at $SOURCE_SHA"

      - name: Merge filtered history into migration branch
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/ordax-os-source"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$DESTINATION_BRANCH"
          git fetch --no-tags "$SRC" HEAD:refs/remotes/source/filtered-surface
          git merge --allow-unrelated-histories --no-ff \
            -m "feat(surface): import UI/workspace history from $SOURCE_REPO@$SOURCE_SHA" \
            refs/remotes/source/filtered-surface
          mkdir -p provenance
          cp "$RUNNER_TEMP/original-surface-blobs.tsv" provenance/original-os-git-blobs.tsv
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          source_sha = os.environ["SOURCE_SHA"]
          filtered = (Path(os.environ["RUNNER_TEMP"]) / "filtered-source-commit").read_text().strip()
          blobs = Path("provenance/original-os-git-blobs.tsv").read_bytes()
          manifest = {
              "$schema": "ordax.surface-source-provenance/1",
              "status": "migration-candidate",
              "source_repository": os.environ["SOURCE_REPO"],
              "source_commit": source_sha,
              "filtered_history_commit": filtered,
              "source_paths": ["system/surface/ui/", "system/surface/workspace/"],
              "file_count": len(blobs.splitlines()),
              "source_blob_map": "provenance/original-os-git-blobs.tsv",
              "source_blob_map_sha256": hashlib.sha256(blobs).hexdigest(),
              "ownership_cutover_complete": False,
              "note": "Filtered Git history retains authorship; source content modes and Git blob IDs were compared byte-for-byte at the pinned OS commit. This is not a production release."
          }
          Path("provenance/import.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          PY
          git add provenance/
          git commit -m "docs(surface): record immutable OS baseline and exact source blob provenance"
          git push origin "HEAD:refs/heads/$DESTINATION_BRANCH"

      - name: Import evidence
        run: |
          echo "Source: $SOURCE_REPO@$SOURCE_SHA"
          echo "Destination: $DESTINATION_BRANCH"
          git log -3 --oneline
          git status --short
