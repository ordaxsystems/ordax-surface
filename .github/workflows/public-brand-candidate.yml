name: Surface Public Brand Candidate

on:
  push:
    branches: [main]
    paths:
      - 'system/surface/ui/tokens.css'
      - 'system/surface/ui/meridian.tokens.css'
      - 'system/surface/ui/brand/**'
      - 'system/surface/ui/fonts/**'
      - 'tools/public-artifacts/**'
      - 'tests/test_public_brand_artifact.py'
      - '.github/workflows/public-brand-candidate.yml'
  pull_request:
    paths:
      - 'system/surface/ui/tokens.css'
      - 'system/surface/ui/meridian.tokens.css'
      - 'system/surface/ui/brand/**'
      - 'system/surface/ui/fonts/**'
      - 'tools/public-artifacts/**'
      - 'tests/test_public_brand_artifact.py'
      - '.github/workflows/public-brand-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-bound-brand:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact Surface candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # PR workflows default to a synthetic merge SHA; artifact provenance
          # must identify the exact immutable Surface candidate commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: surface

      - name: Checkout frozen canonical Inter license only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ordaxsystems/ordax-os
          ref: f65acc4fb9f8ded376fc9b44b4c7c2068c793265
          persist-credentials: false
          sparse-checkout: |
            third_party/licenses/Inter-OFL-1.1.txt
          path: os-license

      - name: Assert exact licensed sources and independent output
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C os-license rev-parse HEAD)" = f65acc4fb9f8ded376fc9b44b4c7c2068c793265
          test "$(git -C os-license rev-parse HEAD:third_party/licenses/Inter-OFL-1.1.txt)" = 556792990d740c111b4fee7fe1938dc90bcee2ce
          git -C surface status --porcelain
          python3 surface/tools/public-artifacts/brand.py build \
            --os-source-dir os-license \
            --os-source-commit f65acc4fb9f8ded376fc9b44b4c7c2068c793265 \
            --out-dir "${{ runner.temp }}/surface-brand-one" > "${{ runner.temp }}/brand-receipt-one.json"
          python3 surface/tools/public-artifacts/brand.py build \
            --os-source-dir os-license \
            --os-source-commit f65acc4fb9f8ded376fc9b44b4c7c2068c793265 \
            --out-dir "${{ runner.temp }}/surface-brand-two" > "${{ runner.temp }}/brand-receipt-two.json"
          diff -qr "${{ runner.temp }}/surface-brand-one" "${{ runner.temp }}/surface-brand-two"
          diff -u "${{ runner.temp }}/brand-receipt-one.json" "${{ runner.temp }}/brand-receipt-two.json"
          test "$(find "${{ runner.temp }}/surface-brand-one" -type f | wc -l)" = 7
          source_sha="$(git -C surface rev-parse HEAD)"
          manifest_sha="$(sha256sum "${{ runner.temp }}/surface-brand-one/manifest.json" | cut -d' ' -f1)"
          python3 surface/tools/public-artifacts/brand.py verify \
            --package-dir "${{ runner.temp }}/surface-brand-one" \
            --expected-source-commit "$source_sha" \
            --manifest-sha256 "$manifest_sha"
          echo "SURFACE_BRAND_CANDIDATE=PASS"
          echo "SURFACE_BRAND_SOURCE=$source_sha"
          echo "SURFACE_BRAND_MANIFEST_SHA256=$manifest_sha"

      - name: Verify actual GNU archive layout before any signature or release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/brand-verified.tar.gz"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            --format=gnu -cf - -C "$RUNNER_TEMP/surface-brand-one" . \
            | gzip -n > "$archive"
          archive_sha="$(sha256sum "$archive" | cut -d' ' -f1)"
          manifest_sha="$(sha256sum "$RUNNER_TEMP/surface-brand-one/manifest.json" | cut -d' ' -f1)"
          source_sha="$(git -C surface rev-parse HEAD)"
          python3 surface/tools/public-artifacts/brand.py verify-archive \
            --archive "$archive" \
            --archive-sha256 "$archive_sha" \
            --manifest-sha256 "$manifest_sha" \
            --expected-source-commit "$source_sha"
          echo "SURFACE_BRAND_GNU_TAR=VERIFIED"

      - name: Verify fail-closed brand artifact tests
        working-directory: surface
        env:
          ORDAX_FROZEN_OS_LICENSE_SOURCE: ${{ github.workspace }}/os-license
          ORDAX_FROZEN_OS_LICENSE_COMMIT: f65acc4fb9f8ded376fc9b44b4c7c2068c793265
        run: python3 -m unittest discover -s tests -p 'test_public_brand_artifact.py' -v

      - name: Upload candidate for downstream review (not an official release)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: surface-brand-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/surface-brand-one/
          if-no-files-found: error
          retention-days: 14

  # Only the reviewed main branch can mint a trusted workflow identity.
  # Pull requests retain read-only CI and cannot exercise the signer.
  attest-main-brand:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: source-bound-brand
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact reviewed main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: surface

      - name: Download candidate from this same workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: surface-brand-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/surface-brand-input

      - name: Verify candidate and create deterministic attestation subject
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git -C surface rev-parse HEAD)"
          test "$candidate_sha" = "$GITHUB_SHA"
          # Trust only the immutable builder and the exact artifact from needs.
          manifest_sha="$(sha256sum "${{ runner.temp }}/surface-brand-input/manifest.json" | cut -d' ' -f1)"
          python3 surface/tools/public-artifacts/brand.py verify \
            --package-dir "${{ runner.temp }}/surface-brand-input" \
            --expected-source-commit "$candidate_sha" \
            --manifest-sha256 "$manifest_sha"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            --format=gnu -cf - -C "${{ runner.temp }}/surface-brand-input" . \
            | gzip -n > "${{ runner.temp }}/ordax-brand-${{ github.sha }}.tar.gz"
          test -s "${{ runner.temp }}/ordax-brand-${{ github.sha }}.tar.gz"
          echo "SURFACE_BRAND_ARCHIVE_SHA256=$(sha256sum "${{ runner.temp }}/ordax-brand-${{ github.sha }}.tar.gz" | cut -d' ' -f1)"

      - name: Attest immutable archive provenance with GitHub OIDC
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/ordax-brand-${{ github.sha }}.tar.gz

      - name: Verify GitHub signature, signer workflow and main source identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify "${{ runner.temp }}/ordax-brand-${{ github.sha }}.tar.gz" \
            --repo ordaxsystems/ordax-surface \
            --signer-workflow ordaxsystems/ordax-surface/.github/workflows/public-brand-candidate.yml \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          echo "SURFACE_BRAND_PROVENANCE=VERIFIED_MAIN_ONLY"

      - name: Retain attested archive for review (no GitHub Release)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: attested-brand-main-${{ github.sha }}
          path: ${{ runner.temp }}/ordax-brand-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14


  # Brand remains Dev-only: publish a durable, signed owner asset for exact
  # source revisions. Does not authorize commercial, production or Stable.
  publish-dev-brand:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: attest-main-brand
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ordaxsystems/ordax-surface
    steps:
      - name: Checkout exact signed Surface source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retrieve attested archive from current run only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: attested-brand-main-${{ github.sha }}
          path: ${{ runner.temp }}/signed-brand
      - name: Verify signature, TAR inventory and reproduce immutable pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          archive="$RUNNER_TEMP/signed-brand/ordax-brand-$GITHUB_SHA.tar.gz"
          test -f "$archive" && test ! -L "$archive"
          gh attestation verify "$archive" --repo "$REPOSITORY" \
            --signer-workflow "$REPOSITORY/.github/workflows/public-brand-candidate.yml" \
            --source-digest "$GITHUB_SHA" --source-ref refs/heads/main \
            --deny-self-hosted-runners
          archive_sha="$(sha256sum "$archive" | cut -d' ' -f1)"
          manifest_sha="$(tar -xOzf "$archive" ./manifest.json | sha256sum | cut -d' ' -f1)"
          python3 tools/public-artifacts/brand.py verify-archive \
            --archive "$archive" --expected-source-commit "$GITHUB_SHA" \
            --manifest-sha256 "$manifest_sha" --archive-sha256 "$archive_sha"
          echo "SURFACE_BRAND_DEV_ARCHIVE_SHA256=$archive_sha"
          echo "SURFACE_BRAND_DEV_MANIFEST_SHA256=$manifest_sha"
      - name: Create verifiable nonproduction prerelease
        shell: bash
        run: |
          set -euo pipefail
          tag="brand-dev-$GITHUB_SHA"
          archive="$RUNNER_TEMP/signed-brand/ordax-brand-$GITHUB_SHA.tar.gz"
          if ! gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" "$archive" --repo "$REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "OrdaX Brand Dev $GITHUB_SHA" \
              --notes "Signed brand artifact for development only. No production, Stable, Site deployment or commerce authorization."
          fi
          gh release view "$tag" --repo "$REPOSITORY" \
            --json tagName,isDraft,isPrerelease,targetCommitish,assets \
            | jq -e --arg tag "$tag" --arg sha "$GITHUB_SHA" \
              --arg file "ordax-brand-$GITHUB_SHA.tar.gz" \
              '(.tagName==$tag) and (.isDraft==false) and (.isPrerelease==true) and
               (.targetCommitish==$sha) and (.assets|length==1) and (.assets[0].name==$file)' >/dev/null
          mkdir -p "$RUNNER_TEMP/brand-roundtrip"
          gh release download "$tag" --repo "$REPOSITORY" \
            --pattern "ordax-brand-$GITHUB_SHA.tar.gz" \
            --dir "$RUNNER_TEMP/brand-roundtrip"
          cmp "$archive" "$RUNNER_TEMP/brand-roundtrip/ordax-brand-$GITHUB_SHA.tar.gz"
          echo "SURFACE_BRAND_DEV_PRERELEASE=VERIFIED"
