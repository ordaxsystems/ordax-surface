name: Surface source integration candidate

on:
  push:
    branches: [main]
    paths:
      - 'system/surface/ui/**'
      - 'system/surface/workspace/**'
      - 'provenance/**'
      - 'tests/**'
      - 'tools/public-artifacts/meridian-preview*'
      - '.github/workflows/validate-source-integration.yml'
  pull_request:
    paths:
      - 'system/surface/ui/**'
      - 'system/surface/workspace/**'
      - 'provenance/**'
      - 'tests/**'
      - 'tools/public-artifacts/meridian-preview*'
      - '.github/workflows/validate-source-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-and-native-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout Surface candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          path: surface

      - name: Checkout immutable OS import baseline (provenance only)
        uses: actions/checkout@v4
        with:
          repository: ordaxsystems/ordax-os
          ref: f65acc4fb9f8ded376fc9b44b4c7c2068c793265
          persist-credentials: false
          sparse-checkout: |
            system/surface/ui
            system/surface/workspace
          path: os-import

      - name: Checkout current OS integration host (not historical baseline)
        uses: actions/checkout@v4
        with:
          repository: ordaxsystems/ordax-os
          ref: main
          persist-credentials: false
          path: os

      - name: Record exact integration revisions
        shell: bash
        run: |
          echo "SURFACE_CANDIDATE_SHA=$(git -C surface rev-parse HEAD)"
          echo "OS_CURRENT_HOST_SHA=$(git -C os rev-parse HEAD)"
          echo "OS_HISTORICAL_IMPORT_SHA=$(git -C os-import rev-parse HEAD)"

      - name: Verify imported source provenance and mount only visual source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          surface = Path("surface")
          manifest = json.loads((surface / "provenance/import.json").read_text())
          if manifest["source_commit"] != "f65acc4fb9f8ded376fc9b44b4c7c2068c793265":
              raise SystemExit("wrong immutable source baseline")
          blobmap = (surface / manifest["source_blob_map"]).read_bytes()
          if hashlib.sha256(blobmap).hexdigest() != manifest["source_blob_map_sha256"]:
              raise SystemExit("corrupted source provenance")
          if len(blobmap.splitlines()) != 157 or manifest["file_count"] != 157:
              raise SystemExit("wrong source file count")
          # Baseline provenance is immutable. Compare the frozen original
          # file identities against the frozen OS commit BEFORE overlaying.
          lines = blobmap.decode("utf-8").splitlines()
          for line in lines:
              metadata, relative = line.split("\t", 1)
              mode, kind, expected = metadata.split()
              original = (Path("os-import") / relative).read_bytes()
              actual = hashlib.sha1(b"blob " + str(len(original)).encode() + b"\0" + original).hexdigest()
              if mode != "100644" or kind != "blob" or actual != expected:
                  raise SystemExit(f"original OS import provenance mismatch: {relative}")
          print(f"Verified {len(lines)} original Git blobs at frozen OS baseline")
          PY
          # The post-cutover OS must not track another copy of visual source.
          if git -C os ls-files -- system/surface/ui system/surface/workspace | grep -q .; then
            echo "::error::Current OS still tracks Surface visual source"
            exit 1
          fi
          for part in ui workspace; do
            source="surface/system/surface/$part"
            target="os/system/surface/$part"
            test -d "$source" && test ! -L "$source"
            test ! -e "$target" && test ! -L "$target" || {
              echo "::error::OS host already contains a Surface visual tree"
              exit 1
            }
            cp -a "$source" "$target"
          done
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          # Later legitimate Surface changes must be checked against the
          # candidate Git HEAD, not the frozen pre-migration baseline.
          records = subprocess.check_output([
              "git", "-C", "surface", "ls-tree", "-r", "-z", "HEAD",
              "--", "system/surface/ui", "system/surface/workspace",
          ])
          verified = 0
          for record in records.split(b"\0"):
              if not record:
                  continue
              meta, name = record.split(b"\t", 1)
              mode, kind, expected = meta.decode("ascii").split()
              relative = name.decode("utf-8")
              if mode not in ("100644", "100755") or kind != "blob":
                  raise SystemExit(f"invalid candidate tree entry: {relative}")
              actual_file = Path("os") / relative
              if actual_file.is_symlink():
                  raise SystemExit(f"candidate source symlink: {relative}")
              data = actual_file.read_bytes()
              actual = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              if actual != expected:
                  raise SystemExit(f"Surface candidate Git blob mismatch: {relative}")
              verified += 1
          if not verified:
              raise SystemExit("Surface candidate has no visual source files")
          print(f"Verified {verified} candidate Surface blobs after overlay onto current OS")
          PY

      - name: Set up Node for Web typecheck and bundle
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Surface-owned regression proofs (no OS source duplication)
        working-directory: surface
        run: node --test tests/*.test.mjs

      - name: Install OS-locked Web dependencies
        working-directory: os
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Web typecheck and bundle from imported Surface source
        working-directory: os
        run: npm run build --workspace tools/surface-web

      - name: Prove read-only Meridian renderer across immutable owners
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p os/tools/surface-demo
          cp surface/tools/public-artifacts/meridian-preview* os/tools/surface-demo/
          export ORDAX_SURFACE_CANDIDATE_SHA="$(git -C surface rev-parse HEAD)"
          python3 os/tools/public-site/playground_fixture.py \
            --project-catalog "$RUNNER_TEMP/ordax-catalog.json"
          node os/tools/surface-demo/meridian-preview.mjs \
            "$RUNNER_TEMP/meridian-preview-one" "$PWD/surface" "$RUNNER_TEMP/ordax-catalog.json"
          node os/tools/surface-demo/meridian-preview.mjs \
            "$RUNNER_TEMP/meridian-preview-two" "$PWD/surface" "$RUNNER_TEMP/ordax-catalog.json"
          diff -qr "$RUNNER_TEMP/meridian-preview-one" "$RUNNER_TEMP/meridian-preview-two"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"meridian-preview-one"
          manifest=json.loads((root/"manifest.json").read_text())
          assert manifest["artifact_class"]=="ordax-meridian-preview"
          assert manifest["runtime_authority"] is False
          assert manifest["status"]=="candidate-not-published"
          assert len(manifest["files"])>=2
          for file in manifest["files"]:
              data=(root/file["path"]).read_bytes()
              assert len(data)==file["size"]
              assert hashlib.sha256(data).hexdigest()==file["sha256"]
          fixture=json.loads((root/"assets/playground-fixture.json").read_text())
          assert fixture["$schema"]=="prototype-ordax.public-playground-fixture/1"
          assert fixture["apps"] and fixture["home"]["rail_apps"]
          payload=fixture["surface"]
          assert len(payload["views"])==11
          assert payload["presentation"]=="example-only-not-an-authorized-session"
          assert any(s["repository"]=="ordaxsystems/ordax-os" for s in payload["sources"])
          assert any(s["repository"]=="ordaxsystems/ordax-surface" for s in payload["sources"])
          assert payload["cssSha256"]==hashlib.sha256((root/"assets/surface-snapshot.css").read_bytes()).hexdigest()
          assert "sourceCopy" in payload
          assert not (root/"assets/surface-preview.json").exists()
          print("MERIDIAN_PREVIEW_PROVENANCE=PASS")
          PY
          git -C surface diff --exit-code
          git -C os diff --exit-code

      - name: Validate canonical module boundaries
        working-directory: os
        run: python3 tools/verify/module_boundaries.py

      - name: Verify Surface, Native host and source graph regressions
        working-directory: os
        run: |
          python3 -m unittest \
            tests.test_surface_ui_contract \
            tests.test_surface_visual_identity \
            tests.test_surface_boot_screen \
            tests.test_notification_center_ui_contract \
            tests.test_surface_web_builder \
            tests.test_native_host_module_integrity \
            tests.test_system_runtime_contract -v

      - name: Verify shared Surface state and localization
        working-directory: os
        run: |
          node --test \
            tests/test_surface_workspace.mjs \
            tests/test_surface_localization.mjs \
            tests/test_sidebar_layout.mjs

      - name: Prove shared Native Surface in Chromium at desktop and mobile viewports
        working-directory: os
        run: |
          set -euo pipefail
          node tools/surface-native/browser-smoke.mjs
